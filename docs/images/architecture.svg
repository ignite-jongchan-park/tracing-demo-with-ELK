  <text x="179" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">Logstash</text>

  <rect x="270" y="252" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="345" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">Elasticsearch</text>

  <rect x="452" y="252" width="118" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="511" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">Kibana</text>

  <line x1="238" y1="274" x2="268" y2="274" stroke="#888780" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="420" y1="274" x2="450" y2="274" stroke="#888780" stroke-width="2" marker-end="url(#ag)"/>
