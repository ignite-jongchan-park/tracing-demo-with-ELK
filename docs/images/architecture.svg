<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888780"/></marker>
  </defs>

  <!-- service chain -->
  <rect x="20" y="94" width="72" height="44" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5"/>
