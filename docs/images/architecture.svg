  <rect x="118" y="94" width="108" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="172" y="120" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">gateway</text>

  <rect x="252" y="94" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="317" y="120" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">order-service</text>

  <rect x="440" y="44" width="150" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="515" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">inventory-service</text>

  <rect x="440" y="144" width="150" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="515" y="170" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">payment-service</text>

  <line x1="92" y1="116" x2="115" y2="116" stroke="#888780" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="226" y1="116" x2="249" y2="116" stroke="#888780" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="384" y1="108" x2="437" y2="72" stroke="#888780" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="384" y1="124" x2="437" y2="162" stroke="#888780" stroke-width="2" marker-end="url(#ag)"/>

  <!-- log collection arrow -->
  <line x1="300" y1="140" x2="205" y2="248" stroke="#888780" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="368" y="200" text-anchor="middle" font-size="12" fill="#5F5E5A">JSON 로그 (traceId 포함)</text>

  <!-- ELK pipeline -->
