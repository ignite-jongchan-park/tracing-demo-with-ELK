input {
  # 앱의 LogstashTcpSocketAppender 가 보내는 JSON 로그를 수신
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # traceId/spanId/service/method/uri/status/elapsedMs 는 이미 필드로 도착.
  # elapsedMs 를 숫자로 보정(집계/정렬용).
  if [elapsedMs] {
    mutate { convert => { "elapsedMs" => "integer" } }
  }
  if [status] {
    mutate { convert => { "status" => "integer" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tracing-demo-%{+YYYY.MM.dd}"
  }
  # 디버깅용: Logstash 컨테이너 로그로도 출력
  stdout { codec => rubydebug }
}
