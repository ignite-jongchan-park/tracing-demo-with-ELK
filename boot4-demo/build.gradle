plugins {
    id 'org.springframework.boot' version '4.0.0' apply false
}

// 데모용 공통 설정: 모든 서브프로젝트에 Java 25 toolchain + Spring Boot BOM 적용.
subprojects {
    apply plugin: 'java'

    group = 'com.demo'
    version = '0.0.1'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://repo.spring.io/milestone' }
    }

    dependencies {
        // Gradle 9 안전: dependency-management 플러그인 대신 platform BOM 으로 버전 정렬.
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.0')
        testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.0')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
