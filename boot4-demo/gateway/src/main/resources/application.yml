server:
  port: 8080

spring:
  application:
    name: gateway
  # WebClient(reactor) 체인에서도 MDC/추적 컨텍스트가 자동 전파되도록.
  reactor:
    context-propagation: auto

management:
  tracing:
    sampling:
      probability: 1.0   # 데모: 모든 요청 추적

logstash:
  destination: ${LOGSTASH_DESTINATION:localhost:5000}

services:
  order:
    url: ${ORDER_URL:http://localhost:8081}
