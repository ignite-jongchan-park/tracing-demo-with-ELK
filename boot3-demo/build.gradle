// Spring Boot 3 에서의 분산 추적 최소 구성.
// 핵심: starter-actuator + micrometer-tracing-bridge-otel 딱 두 개면
//       요청 로그에 [앱,traceId,spanId] 가 자동으로 찍힌다.
//       (Boot 4 에서는 이 두 개만으로는 traceId 가 빈칸이 된다 — 그게 발표의 삽질 포인트)
plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'java'
}

group = 'com.demo'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // 관측/추적 자동구성 (Boot 3 에선 여기 통합돼 있음)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'            // Micrometer<->OTel bridge
}

// bootJar 만 산출하도록 plain jar 비활성화
tasks.named('jar') {
    enabled = false
}
